<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Daily Huddle – das Tagesrätsel der Styrian Studs</title>
<meta name="description" content="Jeden Tag ein Sportmoment: Wann, wo, wer und wie viel? Das Tagesrätsel der Styrian Studs.">
<meta property="og:title" content="Daily Huddle 🏈 Das Tagesrätsel der Styrian Studs">
<meta property="og:description" content="Jeden Tag ein Sportmoment in vier Downs: Wann? Wo? Wer? Wie viel? Green Hearts can’t lose! 💚">
<meta property="og:type" content="website">

<meta property="og:image:width" content="1200">

<meta property="og:url" content="https://prof-bra.github.io/daily-hudle/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Graduate&family=Saira:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4F0; --surface:#FFFFFF; --ink:#0B2B1B; --muted:#4F6A5B; --line:#CFDDD4;
  --studs:#0E7A3C; --on-studs:#FFFFFF; --gold:#F1B82D; --on-gold:#2A1E00; --bad:#C7362F;
  --sea:#DCEBF0; --land:#CFDCCF; --land-hi:#A9C9AE; --land-sel:#F1B82D; --land-stroke:#FFFFFF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08150F; --surface:#11231A; --ink:#E5F0E9; --muted:#93AE9F; --line:#24402F;
    --studs:#1F9B53; --gold:#F5C443; --bad:#FF6B61;
    --sea:#0E2230; --land:#2A4236; --land-hi:#3E6450; --land-sel:#C99A22; --land-stroke:#0E2230; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08150F; --surface:#11231A; --ink:#E5F0E9; --muted:#93AE9F; --line:#24402F;
  --studs:#1F9B53; --gold:#F5C443; --bad:#FF6B61;
  --sea:#0E2230; --land:#2A4236; --land-hi:#3E6450; --land-sel:#C99A22; --land-stroke:#0E2230; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16.5px;line-height:1.5;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.hero{position:relative;overflow:hidden;color:var(--on-studs);
  background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(255,255,255,.16) calc(10% - 2px) 10%),
  linear-gradient(160deg,#13914A 0%,#0E7A3C 45%,#08502A 100%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,#fff 0 14px,transparent 14px 28px);opacity:.5}
.hero-in{max-width:620px;margin:0 auto;padding:18px 16px 26px;display:flex;gap:14px;align-items:center}
.hero-txt{flex:1;min-width:0}
.club{margin:0 0 6px;font-weight:600;font-size:.88rem;opacity:.92}
.word{font-family:"Graduate",Georgia,serif;font-weight:400;font-size:clamp(2.1rem,10.5vw,3.4rem);line-height:.95;margin:0;letter-spacing:.01em;text-shadow:0 3px 0 rgba(0,0,0,.22)}
.motto{display:inline-block;margin-top:12px;background:var(--gold);color:var(--on-gold);font-weight:700;font-size:.9rem;padding:4px 11px;border-radius:4px}
.jersey{flex:0 0 auto;width:min(30vw,132px);filter:drop-shadow(0 5px 0 rgba(0,0,0,.2))}
.jersey text{font-family:"Graduate",Georgia,serif}

.wrap{max-width:620px;margin:0 auto;padding:16px 16px 56px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;font-size:.95rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--studs);color:var(--on-studs)}
.view[hidden]{display:none}
.daybar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.daybar h2{font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:1.75rem;line-height:1.05;margin:0}
.daybar p{margin:0;color:var(--muted);font-size:.9rem}
.trikot{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.88rem;white-space:nowrap}
.intro{margin:0 0 14px;color:var(--muted)}
.banner{background:var(--surface);border-left:4px solid var(--gold);padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:14px;font-size:.95rem}

/* Spielzug-Karte */
.play{background:var(--studs);color:var(--on-studs);border-radius:4px 18px 4px 18px;padding:18px 18px 20px;margin-bottom:22px}
.play .kick{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:1rem;opacity:.85;margin:0}
.play h3{font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:1.7rem;line-height:1.05;margin:2px 0 10px}
.play p.story{margin:0;font-size:1.04rem;line-height:1.55}

.step{margin-bottom:26px}
.step[hidden]{display:none}
.step h4{font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:1.45rem;line-height:1.1;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.step h4 .dn{flex:none;font-size:.95rem;padding:3px 9px;border-radius:6px;background:var(--gold);color:var(--on-gold)}
.step.done h4 .dn{background:var(--studs);color:var(--on-studs)}

.yearpick{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 6px}
#ho{font-family:"Graduate",Georgia,serif;font-size:clamp(2.2rem,11vw,3.2rem);line-height:1;font-variant-numeric:tabular-nums}
.yearpick output{font-family:"Graduate",Georgia,serif;font-size:3.6rem;line-height:1;min-width:4.4ch;text-align:center;font-variant-numeric:tabular-nums}
.round{width:50px;height:50px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.5rem;line-height:1}
.round:disabled{opacity:.35}
input[type=range]{width:100%;accent-color:var(--studs);margin:8px 0 14px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px 14px;font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:1.2rem;background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.fb{margin-top:12px;padding:11px 14px;border-left:4px solid var(--studs);background:var(--surface);border-radius:0 8px 8px 0}
.fb[hidden]{display:none}
.fb .pts{font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:1.25rem;color:var(--studs)}

/* Karte: volle Breite */
.mapbox{--sea:#A8D5EC;--land:#F4F1E6;--land-hi:#E4DDC5;--land-sel:#F6CB4F;--land-stroke:#A39C88;position:relative;width:min(100vw,900px);left:50%;transform:translateX(-50%);background:var(--sea);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:12px}
@media (min-width:640px){.mapbox{border:1px solid var(--line);border-radius:12px;overflow:hidden}}
#map{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;overflow:hidden}
#map .sea{fill:var(--sea)}
#map .grat{fill:none;stroke:#FFFFFF;stroke-width:.6;opacity:.45;vector-effect:non-scaling-stroke}
#map .land{fill:var(--land);stroke:var(--land-stroke);stroke-width:.7;vector-effect:non-scaling-stroke}
#map .land.hover{fill:var(--land-hi)}
#map .land.sel{fill:var(--land-sel)}
#map .lake{fill:var(--sea);stroke:#7FB6D3;stroke-width:.5;vector-effect:non-scaling-stroke;pointer-events:none}
#map .river{fill:none;stroke:#6AAFD6;stroke-width:1.1;vector-effect:non-scaling-stroke;pointer-events:none}
#map .city{fill:#6B6352;stroke:#FFFFFF;pointer-events:none}
#map .arc{fill:none;stroke:#0B2B1B;stroke-width:2.5;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
#map .pin-guess{fill:#F1B82D;stroke:#0B2B1B}
#map .pin-truth{fill:var(--bad);stroke:#fff}
.chip{position:absolute;left:10px;top:10px;max-width:calc(100% - 70px);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.92rem;box-shadow:0 2px 0 rgba(0,0,0,.12);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:empty{display:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;line-height:1}
.maphint{margin:-4px 0 10px;color:var(--muted);font-size:.92rem}
.rule{margin:-6px 0 12px;color:var(--muted);font-size:.9rem}
.legend{display:flex;gap:16px;font-size:.88rem;color:var(--muted);margin:-4px 0 10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend[hidden]{display:none}
.maperr{padding:40px 16px;text-align:center;color:var(--muted)}

/* Wer */
.whoq{margin:0 0 10px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:0;border-radius:10px;padding:12px 10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;text-align:left;line-height:1.25}
.opt.wrong{background:transparent;text-decoration:line-through;color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad);opacity:.75}
.opt.right{background:var(--studs);color:var(--on-studs);box-shadow:none}

/* Auflösung */
.reveal h3{font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:1.6rem;line-height:1.1;margin:0 0 4px}
.reveal .where{color:var(--muted);margin:0 0 12px}
.facts{list-style:none;margin:0 0 16px;padding:0}
.facts li{position:relative;padding:11px 14px 11px 42px;background:var(--surface);border-radius:8px;margin-bottom:8px}
.facts li::before{content:"🏈";position:absolute;left:13px;top:10px;font-size:1rem}
.result{background:var(--studs);color:var(--on-studs);border-radius:14px;padding:18px}
.result .tot{font-family:"Graduate",Georgia,serif;font-size:3.2rem;line-height:1}
.result .tot small{font-family:"Saira",sans-serif;font-size:1rem;opacity:.85}
.result .lab{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:1.35rem;margin:4px 0 10px}
.result table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:.95rem}
.result td{padding:5px 0;border-top:1px solid rgba(255,255,255,.25)}
.result td:last-child{text-align:right;font-weight:700}
.result .btn{background:#fff;color:#08502A}
.send{margin:0 0 12px;font-size:.95rem;font-weight:600}
.mini{margin-top:16px}
.mini h5{font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:1.35rem;margin:0 0 8px}
.mini .gap{text-align:center;color:var(--muted);margin:2px 0 6px}
.send:empty{display:none}
.send .trikot{color:#0B2B1B;margin-left:6px}
.result .btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}

/* Bestenlisten */
.lb-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.lb-head h2{font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:1.6rem;margin:0}
.lb-head span{color:var(--muted);font-size:.9rem}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:2.2rem 1fr auto;align-items:center;gap:10px;background:var(--surface);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.lb li.me{box-shadow:inset 0 0 0 2px var(--gold)}
.lb .rk{font-family:"Graduate",Georgia,serif;font-size:1.15rem;text-align:center}
.lb li:nth-child(1) .rk{color:var(--gold)}
.lb .nm{font-weight:600;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lb .nm small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.lb .sc{text-align:right;font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:1.3rem;line-height:1.1}
.lb .sc small{display:block;font-family:"Saira",sans-serif;font-weight:400;font-size:.78rem;color:var(--muted)}
.empty{background:var(--surface);border-radius:10px;padding:18px;color:var(--muted);text-align:center}
.daysel{font:inherit;font-weight:600;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.stand{margin:-4px 0 12px;color:var(--muted);font-size:.88rem}
.keeper{margin-top:24px;background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:inset 0 0 0 2px var(--gold)}
.keeper summary{cursor:pointer;font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:1.25rem}
.keeper p{margin:8px 0;font-size:.92rem;color:var(--muted)}
.keeper textarea{width:100%;min-height:120px;font:inherit;font-size:.9rem;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
.krep,.klist{list-style:none;margin:8px 0 0;padding:0;font-size:.92rem}
.krep li{padding:4px 0;border-bottom:1px solid var(--line)}
.klist{display:flex;flex-wrap:wrap;gap:6px}
.klist button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:.85rem}
.klist button.gone{text-decoration:line-through;color:var(--bad);border-color:var(--bad)}
.practice{display:grid;gap:8px;margin-top:8px}
.practice button{text-align:left;border:0;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:12px 14px}
.practice b{display:block;font-family:"Saira Condensed",sans-serif;font-size:1.15rem}
.practice span{color:var(--muted);font-size:.9rem}
.admin{margin-top:22px;padding-top:14px;border-top:1px dashed var(--line);font-size:.9rem;color:var(--muted)}
.admin select{font:inherit;padding:6px;border-radius:6px;background:var(--surface);color:var(--ink);border:1px solid var(--line);max-width:100%}

dialog{border:0;border-radius:14px;padding:20px;max-width:360px;width:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,20,10,.55)}
dialog h3{font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:1.5rem;margin:0 0 6px}
dialog label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
dialog input{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <div class="hero-txt">
      <p class="club">Das Tagesrätsel der Styrian Studs 💚</p>
      <h1 class="word">Daily<br>Huddle</h1>
      <span class="motto" id="motto">November: Road to LA28</span>
    </div>
    <svg class="jersey" viewBox="0 0 120 130" aria-hidden="true">
      <path d="M38 6 L18 12 L2 40 L20 52 L28 40 L28 124 L92 124 L92 40 L100 52 L118 40 L102 12 L82 6 Q60 22 38 6 Z" fill="#fff"/>
      <path d="M38 6 Q60 22 82 6" fill="none" stroke="#0E7A3C" stroke-width="5"/>
      <rect x="28" y="104" width="64" height="7" fill="#F1B82D"/>
      <text id="jerseyNum" x="60" y="92" text-anchor="middle" font-size="46" fill="#0E7A3C">1</text>
    </svg>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-v="play">Rätsel</button>
    <button role="tab" aria-selected="false" data-v="today">Heute</button>
    <button role="tab" aria-selected="false" data-v="month">MVP-Race</button>
  </nav>

  <section class="view" id="v-play">
    <div class="daybar">
      <div><p id="dateLine"></p><h2 id="dayTitle">Spielzug des Tages</h2></div>
      <button class="trikot" id="trikotBtn">Dein Trikot</button>
    </div>
    <div id="playArea"></div>
  </section>

  <section class="view" id="v-today" hidden>
    <div class="lb-head"><h2>Play of the Day</h2><select id="daySel" class="daysel" aria-label="Tag wählen"></select></div>
    <p class="stand" id="stand1"></p>
    <div id="todayBoard"></div>
  </section>

  <section class="view" id="v-month" hidden>
    <div class="lb-head"><h2>MVP-Race</h2><span id="monthLabel"></span></div>
    <p class="stand" id="stand2"></p>
    <div id="monthBoard"></div>
  </section>
</div>

<dialog id="dlg">
  <h3>Dein Trikot</h3>
  <p style="margin:0;color:var(--muted);font-size:.92rem">Deine Rückennummer ist deine Erkennung in der Wertung – bitte immer dieselbe verwenden.</p>
  <label for="nickIn">Spitzname</label>
  <input id="nickIn" maxlength="18" autocomplete="nickname">
  <label for="numIn">Rückennummer</label>
  <input id="numIn" inputmode="numeric" maxlength="2">
  <div class="row" style="margin-top:16px"><button class="btn ghost" id="dlgCancel">Abbrechen</button><button class="btn" id="dlgSave">Speichern</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>

const MW=960,MH=700;let M=null;

    $("mapbox").innerHTML='<p class="maperr">Die Weltkarte konnte nicht geladen werden. Prüfe deine Internetverbindung und lade die Seite neu.</p>';return;}
  const scale=MH/((84+58)*Math.PI/180);const worldW=2*Math.PI*scale;
  const proj=d3.geo.equirectangular().scale(scale).translate([Math.PI*scale,84*Math.PI/180*scale]);

  const svg=d3.select("#map").attr("viewBox",`0 0 ${MW} ${MH}`);
  svg.append("rect").attr("class","sea").attr("width",MW).attr("height",MH);
  const g=svg.append("g");
  g.append("path").datum(d3.geo.graticule().step([30,30])()).attr("class","grat").attr("d",path);
  const topo=Datamap.prototype.worldTopo,key=Object.keys(topo.objects)[0];
  const feats=topojson.feature(topo,topo.objects[key]).features.filter(f=>f.id!=="ATA");
  const lands=g.selectAll(".land").data(feats).enter().append("path").attr("class","land").attr("d",path);
  const arc=g.append("path").attr("class","arc");const pins=g.append("g");
  const lakesG=g.insert("g",".arc"),riversG=g.insert("g",".arc"),citiesG=g.insert("g",".arc");
  const zoom=d3.behavior.zoom().scaleExtent([1,14]).on("zoom",()=>{
    const s=d3.event.scale;let t=d3.event.translate;
    t=[Math.min(0,Math.max(MW-worldW*s,t[0])),Math.min(0,Math.max(MH*(1-s),t[1]))];
    zoom.translate(t);g.attr("transform",`translate(${t})scale(${s})`);drawPins();
    if(s>=1.5)loadDetails();}).on("zoomend",updateDetails);
  M={proj,path,svg,g,lands,arc,pins,zoom,worldW,locked:false,lakesG,riversG,citiesG,drawn:false};
  if(DETAILS)drawDetails();
  const home=()=>{zoom.scale(1).translate([MW/2-proj([12,0])[0],0]);svg.transition().duration(400).call(zoom.event);};
  M.home=home;
  svg.call(zoom).on("dblclick.zoom",null);
  zoom.scale(1).translate([MW/2-proj([12,0])[0],0]);zoom.event(svg);
  lands.on("mousemove",function(f){if(M.locked)return;lands.classed("hover",d=>d===f);if(!G.guess)$("chip").textContent=countryName(f);})

}

const NE_BASES=["https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/","https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/","https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/"];
let DETAILS=null,detailsLoading=false;
async function neFetch(name){for(const b of NE_BASES){try{const r=await fetch(b+name);if(r.ok)return await r.json();}catch(e){}}return null;}
async function loadDetails(){
  if(DETAILS||detailsLoading)return;detailsLoading=true;
  const [lakes,rivers,places]=await Promise.all([neFetch("ne_50m_lakes.geojson"),neFetch("ne_50m_rivers_lake_centerlines.geojson"),neFetch("ne_50m_populated_places_simple.geojson")]);
  DETAILS={lakes:lakes?lakes.features:[],rivers:rivers?rivers.features:[],
    places:places?places.features.filter(f=>f.geometry&&f.geometry.type==="Point").map(f=>{const p=f.properties||{};return{c:f.geometry.coordinates,r:+(p.scalerank??p.SCALERANK??p.min_zoom??6)};}):[]};
  detailsLoading=false;if(M)drawDetails();
}
function drawDetails(){
  if(!M||M.drawn||!DETAILS)return;M.drawn=true;
  M.lakesG.selectAll("path").data(DETAILS.lakes).enter().append("path").attr("class","lake").attr("d",M.path);
  M.riversG.selectAll("path").data(DETAILS.rivers).enter().append("path").attr("class","river").attr("d",M.path);
  M.citiesG.selectAll("circle").data(DETAILS.places).enter().append("circle").attr("class","city")
    .attr("cx",d=>M.proj(d.c)[0]).attr("cy",d=>M.proj(d.c)[1]);
  updateDetails();
}
function updateDetails(){
  if(!M||!M.drawn)return;const k=M.zoom.scale();
  M.riversG.style("display",k>=1.5?null:"none");
  const maxRank=k<2.5?-1:k<4?3:k<7?5:k<10?7:10;
  M.citiesG.selectAll("circle").style("display",d=>d.r<=maxRank?null:"none").attr("r",2.6/k).attr("stroke-width",.8/k);
}
function zoomBy(f){const z=M.zoom,s0=z.scale(),s1=Math.max(1,Math.min(14,s0*f)),t0=z.translate(),c=[MW/2,MH/2];
  z.scale(s1).translate([c[0]-(c[0]-t0[0])*s1/s0,c[1]-(c[1]-t0[1])*s1/s0]);M.svg.transition().duration(250).call(z.event);}
function drawPins(){
  if(!M)return;const k=M.zoom.scale();M.pins.selectAll("*").remove();
  const add=(p,cls)=>{const xy=M.proj([p.lng,p.lat]);M.pins.append("circle").attr("class",cls).attr("cx",xy[0]).attr("cy",xy[1]).attr("r",9/k).attr("stroke-width",3/k);};
  if(G&&G.guess)add(G.guess,"pin-guess");
  if(M.locked)add({lat:G.ev.lat,lng:G.ev.lng},"pin-truth");
}
function confirmMap(){
  if(!G.guess)return;M.locked=true;
  const t={lat:G.ev.lat,lng:G.ev.lng};const km=Math.round(haversine(G.guess,t));G.km=km;G.parts.m=scoreMap(km);
  M.arc.datum({type:"LineString",coordinates:[[G.guess.lng,G.guess.lat],[t.lng,t.lat]]}).attr("d",M.path);
  drawPins();
  const xy=[G.guess,t].map(p=>M.proj([p.lng,p.lat]));const xs=xy.map(p=>p[0]),ys=xy.map(p=>p[1]),pd=90;
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const s=Math.max(1,Math.min(10,MW/(x1-x0+2*pd),MH/(y1-y0+2*pd)));
  M.zoom.scale(s).translate([MW/2-(x0+x1)/2*s,MH/2-(y0+y1)/2*s]);M.svg.transition().duration(800).call(M.zoom.event);
  $("mb").hidden=true;$("mh").hidden=true;$("lg").hidden=false;
  $("f2").innerHTML=`Dein Tipp: ${esc(G.guessCountry)}. Du lagst <b>${fmtN(km)} km</b> daneben.<br><span class="pts">+${G.parts.m} Punkte</span>`;
  $("f2").hidden=false;$("s2").classList.add("done");
  $("s3").hidden=false;renderWho();setTimeout(()=>$("s3").scrollIntoView({behavior:"smooth",block:"start"}),850);
}

// ---------- Wer ----------
function renderWho(){
  const ev=G.ev,opts=shuffle(ev.o,(G.date||"x")+ev.a),done=G.parts.w!==undefined;
  $("opts").innerHTML=opts.map(o=>`<button class="opt${G.wrong.has(o)?" wrong":""}${done&&o===ev.a?" right":""}" ${G.wrong.has(o)||done?"disabled":""}>${esc(o)}</button>`).join("");
  $("opts").querySelectorAll(".opt").forEach((b,i)=>b.onclick=()=>pickWho(opts[i]));
}
function pickWho(o){
  G.tries++;
  if(o===G.ev.a){G.parts.w=scoreWho(G.tries);}
  else{G.wrong.add(o);if(G.tries>=3)G.parts.w=0;}
  if(G.parts.w===undefined){$("f3").innerHTML=G.tries===1?"Falsch – nächster Versuch für 70 Punkte.":"Wieder falsch – letzter Versuch für 40 Punkte.";$("f3").hidden=false;renderWho();return;}
  renderWho();
  $("f3").innerHTML=G.parts.w?`Richtig: <b>${esc(G.ev.a)}</b><br><span class="pts">+${G.parts.w} Punkte</span>`:`Gesucht war: <b>${esc(G.ev.a)}</b><br><span class="pts">+0 Punkte</span>`;
  $("f3").hidden=false;$("s3").classList.add("done");startHow();
}
function startHow(){
  const h=G.ev.h,hr=$("hr");const snap=v=>Math.round(Math.max(h.min,Math.min(h.max,v))/h.step)*h.step;
  const setH=v=>{v=+snap(v).toFixed(dec(h));G.hGuess=v;hr.value=v;$("ho").textContent=fmtH(v,h);$("hu").textContent=h.u.replace(/^\.\s*/,"");};
  setH((h.min+h.max)/2);
  hr.oninput=()=>setH(+hr.value);$("hm").onclick=()=>setH(G.hGuess-h.step);$("hp").onclick=()=>setH(G.hGuess+h.step);
  $("s5").hidden=false;setTimeout(()=>$("s5").scrollIntoView({behavior:"smooth",block:"start"}),300);
  $("hb").onclick=()=>{
    const sc=scoreHow(G.hGuess,h);G.parts.h=sc;G.hd=Math.abs(G.hGuess-h.a);
    ["hm","hp","hb"].forEach(i=>$(i).disabled=true);hr.disabled=true;$("hb").hidden=true;
    $("f5").innerHTML=`Richtig: <b>${unitH(h.a,h)}</b>. ${G.hd===0?"Volltreffer!":`Du lagst ${fmtH(+G.hd.toFixed(dec(h)),h)} daneben.`}<br><span class="pts">+${sc} Punkte</span>`;
    $("f5").hidden=false;$("s5").classList.add("done");finishGame();
  };
}
function finishGame(){
  const p=G.parts.y+G.parts.m+G.parts.w+G.parts.h,s=Math.max(1,Math.round((Date.now()-G.start)/1000));
  const res={p,y:G.parts.y,m:G.parts.m,w:G.parts.w,h:G.parts.h,s,yd:G.yd,km:G.km,wt:G.parts.w===100?1:G.parts.w===70?2:G.parts.w===40?3:4,hd:+G.hd.toFixed(dec(G.ev.h))};
  if(G.ranked){local.res[G.date]=res;lsave();}
  if(G.shareDate&&!G.ranked){local.test=local.test||{};if(!local.test[G.shareDate]){local.test[G.shareDate]=res;lsave();}}
  const box=$("s4");box.hidden=false;box.innerHTML=revealHtml(G.ev,res,G.ranked||!!G.shareDate);
  wireResult(res);
  const dk=G.ranked?G.date:G.shareDate;if(dk&&(G.ranked||local.test[dk]===res))submitResult(dk,res);
  setTimeout(()=>box.scrollIntoView({behavior:"smooth",block:"start"}),300);
}
function revealHtml(ev,res,shareable){
  return `<div class="reveal"><h3>${esc(ev.title)}</h3><p class="where">${ev.y} in ${esc(ev.place)}</p>
    <ul class="facts">${ev.facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>
    <div class="result"><div class="tot">${res.p} <small>/ 400 Punkte</small></div><div class="lab">${label(res.p)}</div>
    <table><tr><td>📅 Wann</td><td>${res.y}</td></tr><tr><td>📍 Wo</td><td>${res.m}</td></tr><tr><td>👤 Wer</td><td>${res.w}</td></tr><tr><td>🔢 Wie viel</td><td>${res.h??0}</td></tr><tr><td>⏱️ Zeit</td><td>${fmtTime(res.s)}</td></tr></table>
    ${shareable?'<p class="send" id="sendState"></p>':""}
    <div class="row">${shareable?'<button class="btn" id="shareBtn">Ergebnis teilen</button>':""}<button class="btn ghost" id="toBoard">${shareable?"Ganze Wertung":"Zurück"}</button></div></div>
    ${shareable?'<div class="mini" id="miniBoard"></div>':""}`;
}
function wireResult(res){
  if($("shareBtn"))$("shareBtn").onclick=()=>share(res);
  $("toBoard").onclick=()=>{if($("shareBtn"))document.querySelector('.tabs [data-v="today"]').click();else renderPlay();};
}

// ---------- Teilen ----------
const normN=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");
function fnv(str){let h=2166136261;for(const ch of str){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0;}return h.toString(36);}
const hashFor=(date,num,nick,y,m,w,h,s)=>fnv(`${date}|${num}|${normN(nick)}|${y}|${m}|${w}|${h}|${s}|studs2005`).slice(-5);
async function share(res){
  if(!local.nick){toast("Trag zuerst deinen Namen ein");openTrikot(()=>share(res));return;}
  const sd=G.shareDate||G.date;const d=+sd.slice(8);
  const text=`🏈 DAILY HUDDLE · ${d}. ${MON[+sd.slice(5,7)-1]}\n👤 ${local.num?"#"+local.num+" ":""}${local.nick}\n\n📅 ${eY(res.yd)} ${res.yd===0?"aufs Jahr genau":"±"+res.yd+" "+(res.yd===1?"Jahr":"Jahre")}\n📍 ${eM(res.km)} ${fmtN(res.km)} km\n👤 ${eW(res.wt)} ${res.wt===1?"sofort erkannt":res.wt===2?"im 2. Versuch":res.wt===3?"im 3. Versuch":"nicht erkannt"}\n🔢 ${eH(res.h)} ${res.hd===0?"Volltreffer":"±"+fmtH(res.hd,G.ev.h)+" "+G.ev.h.u.replace(/^\.\s*/,"")}\n\n🏆 ${res.p}/400 · ${label(res.p)}\n⏱️ ${fmtTime(res.s)}\n\nGreen Hearts can’t lose! 💚\n${GAME_URL}`;
  if(navigator.share){try{await navigator.share({text});return;}catch(e){if(e&&e.name==="AbortError")return;}}
  try{await navigator.clipboard.writeText(text);toast("Ergebnis kopiert");}catch(e){prompt("Zum Kopieren:",text);}
}

// ===================== Ansicht Rätsel =====================
function renderPlay(){
  const area=$("playArea");M=null;
  const ev=eventFor(todayKey);
  if(ev){
    const r=local.res[todayKey];
    if(r){
      G={ev,date:todayKey,ranked:true};
      area.innerHTML=`<p class="intro">Du hast den heutigen Spielzug schon gespielt. Morgen kommt der nächste.</p><section class="step" id="s4">${revealHtml(ev,r,true)}</section>`;
      wireResult(r);submitResult(todayKey,r);addExtras(area);return;
    }
    startGame(ev,{date:todayKey,ranked:true,note:+todayKey.slice(8)===1&&cfg?cfg.intro:""});addExtras(area);return;
  }
  const start=new Date(2026,10,1);const days=Math.ceil((start-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
  const w=days>0?WARMUP.find(x=>x.date===todayKey):null;
  if(w){
    const r=local.test&&local.test[todayKey];
    const note=`Aufwärmen des Tages: Dein erstes Ergebnis zählt für die Aufwärm-Wertung. Offizieller Start ist am 1. November, noch ${days} ${days===1?"Tag":"Tage"}.`;
    if(r){
      G={ev:w,date:"warm"+todayKey,ranked:false,shareDate:todayKey};
      area.innerHTML=`<div class="banner">${note}</div><p class="intro">Du hast das heutige Aufwärmen schon gespielt. Morgen kommt der nächste Spielzug.</p><section class="step" id="s4">${revealHtml(w,r,true)}</section>`;
      wireResult(r);submitResult(todayKey,r);
    }else startGame(w,{date:"warm"+todayKey,ranked:false,shareDate:todayKey,note});
    addExtras(area,false);return;
  }
  area.innerHTML=days>0
    ?`<p class="intro">Saisonstart ist am 1. November: Dann kommt jeden Tag ein neuer Spielzug mit vier Downs – wann, wo, wer und wie viel – zum Motto „Road to LA28“. Noch ${days} ${days===1?"Tag":"Tage"}.</p>`
    :`<p class="intro">Das nächste Monatsmotto kommt bald. Bis dahin steht das Probetraining offen.</p>`;
  addExtras(area,true);
}
function addExtras(area,pre){
  const list=WARMUP.filter(x=>x.date<todayKey);
  if(list.length){
    const wrap=document.createElement("div");
    wrap.innerHTML=`<p class="intro" style="margin-top:22px">${pre?"Probetraining":"Lust auf mehr? Spiel frühere Aufwärm-Spielzüge nach (zählt nicht für die Wertung)."}</p><div class="practice">${list.map(p=>`<button data-d="${p.date}"><b>${esc(p.sport)}</b><span>Aufwärmen vom ${+p.date.slice(8)}. ${MON[+p.date.slice(5,7)-1]}</span></button>`).join("")}</div>`;
    area.appendChild(wrap);
    wrap.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
      const p=WARMUP.find(x=>x.date===b.dataset.d);
      startGame(p,{date:"practice"+p.date,ranked:false,shareDate:null,note:"Probetraining: zählt nicht für die Wertung."});
      addExtras($("playArea"),false);window.scrollTo({top:0,behavior:"smooth"});});
  }
}
// ===================== Wertung (Google-Tabelle) =====================
async function submitResult(date,res){
  local.sent=local.sent||{};const st=$("sendState");
  if(local.sent[date]){if(st)st.textContent="✅ In der Wertung eingetragen";loadBoard();return;}
  if(!apiReady())return;
  if(!local.nick||!local.num){
    if(st){st.innerHTML=`Trag dein Trikot ein, damit dein Ergebnis in die Wertung kommt.<button class="trikot" id="needTrikot">Trikot eintragen</button>`;
      $("needTrikot").onclick=()=>openTrikot(()=>submitResult(date,res));}
    return;}
  if(st)st.textContent="⏳ Wird in die Wertung eingetragen …";
  const body={d:date,num:local.num,n:local.nick,y:res.y,m:res.m,w:res.w,h:res.h,s:res.s,
    c:hashFor(date,local.num,local.nick,res.y,res.m,res.w,res.h,res.s)};
  try{
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
    const j=await r.json();
    if(j.ok||j.reason==="dup"){local.sent[date]=true;lsave();loadBoard(true);}
    if(st)st.textContent=j.ok?"✅ In der Wertung eingetragen":j.reason==="dup"?`ℹ️ Für die Nummer ${local.num} gibt es heute schon ein Ergebnis – es zählt das erste.`:`⚠️ Nicht eingetragen: ${j.msg||"unbekannter Fehler"}`;
  }catch(e){
    if(st){st.innerHTML=`⚠️ Keine Verbindung zur Wertung.<button class="trikot" id="retrySend">Nochmal</button>`;$("retrySend").onclick=()=>submitResult(date,res);}
  }
}
let BOARD={entries:[],at:null,err:null,loading:false};
async function loadBoard(force){
  if(!apiReady()){BOARD.err="notset";renderBoards();return;}
  if(BOARD.loading)return;if(!force&&BOARD.at&&Date.now()-BOARD.at<30000){renderBoards();return;}
  BOARD.loading=true;renderBoards();
  try{const r=await fetch(`${API_URL}?month=${ym}`);const j=await r.json();BOARD.entries=j.entries||[];BOARD.at=Date.now();BOARD.err=null;}
  catch(e){BOARD.err="net";}
  BOARD.loading=false;renderBoards();
}
const nameOf=e=>`#${e.num} ${e.n}`;
let selDay=null;
function renderBoards(){
  const stand=BOARD.loading?"Wird geladen …":BOARD.err==="notset"?"Die Wertung ist noch nicht verbunden.":BOARD.err==="net"?"Keine Verbindung zur Wertung.":BOARD.at?`Stand: ${pad(new Date(BOARD.at).getHours())}:${pad(new Date(BOARD.at).getMinutes())} Uhr`:"";
  $("stand1").innerHTML=$("stand2").innerHTML=`${stand} <button class="trikot" onclick="loadBoard(true)" style="padding:2px 10px;margin-left:6px">↻ Aktualisieren</button>`;
  const me=String(local.num||"");
  const monthEntries=BOARD.entries.filter(e=>String(e.d).slice(0,7)===ym);
  let days=[...new Set(monthEntries.map(e=>e.d))].sort().reverse();
  if(!days.includes(todayKey))days.unshift(todayKey);
  if(!selDay||!days.includes(selDay))selDay=todayKey;
  const sel=$("daySel");
  sel.innerHTML=days.map(d=>`<option value="${d}"${d===selDay?" selected":""}>${d===todayKey?"Heute":`${+d.slice(8)}. ${MON[+d.slice(5,7)-1]}`}</option>`).join("");
  sel.onchange=()=>{selDay=sel.value;renderBoards();};
  const dayList=monthEntries.filter(e=>e.d===selDay).sort((a,b)=>b.p-a.p||a.s-b.s);
  $("todayBoard").innerHTML=dayList.length?`<ol class="lb">${dayList.map((e,i)=>`<li class="${String(e.num)===me?"me":""}"><span class="rk">${i+1}</span><span class="nm">${esc(nameOf(e))}<small>${label(e.p)}</small></span><span class="sc">${e.p}<small>${fmtTime(e.s)}</small></span></li>`).join("")}</ol>`
    :`<div class="empty">${BOARD.loading?"Wird geladen …":"Für diesen Tag gibt es noch keine Ergebnisse."}</div>`;
  const agg={};monthEntries.slice().sort((a,b)=>String(a.d).localeCompare(b.d)).forEach(e=>{const k=String(e.num);const a=agg[k]||(agg[k]={num:k,n:e.n,p:0,s:0,c:0,td:0});
    a.n=e.n;a.p+=e.p;a.s+=e.s;a.c++;if(e.p>=240)a.td++;});
  const month=Object.values(agg).sort((a,b)=>b.p-a.p||b.c-a.c||a.s-b.s);
  renderMini();
  $("monthBoard").innerHTML=month.length?`<ol class="lb">${month.map((e,i)=>`<li class="${e.num===me?"me":""}"><span class="rk">${i+1}</span><span class="nm">${esc(nameOf(e))}<small>${e.c} ${e.c===1?"Tag":"Tage"} gespielt, ${e.td} ${e.td===1?"Touchdown":"Touchdowns"}</small></span><span class="sc">${fmtN(e.p)}<small>Punkte</small></span></li>`).join("")}</ol>`
    :`<div class="empty">${BOARD.loading?"Wird geladen …":"Das MVP-Race startet mit dem ersten Ergebnis des Monats."}</div>`;
}

function renderMini(){
  const box=$("miniBoard");if(!box)return;
  if(BOARD.err){box.innerHTML="";return;}
  const me=String(local.num||"");
  const list=BOARD.entries.filter(e=>e.d===todayKey).sort((a,b)=>b.p-a.p||a.s-b.s);
  if(!list.length){box.innerHTML=BOARD.loading?"":`<h5>🏆 Tageswertung</h5><div class="empty">Noch keine Ergebnisse heute.</div>`;return;}
  const row=(e,i)=>`<li class="${String(e.num)===me?"me":""}"><span class="rk">${i+1}</span><span class="nm">${esc(nameOf(e))}<small>${label(e.p)}</small></span><span class="sc">${e.p}<small>${fmtTime(e.s)}</small></span></li>`;
  const top=list.slice(0,5).map(row).join("");const mi=list.findIndex(e=>String(e.num)===me);
  box.innerHTML=`<h5>🏆 Tageswertung</h5><ol class="lb">${top}</ol>${mi>=5?`<p class="gap">…</p><ol class="lb">${row(list[mi],mi)}</ol>`:""}`;
}

// ===================== Trikot =====================
let afterTrikot=null;
function openTrikot(then){afterTrikot=then||null;$("nickIn").value=local.nick||"";$("numIn").value=local.num||"";$("dlg").showModal();}
$("trikotBtn").onclick=()=>openTrikot();
$("dlgCancel").onclick=()=>{afterTrikot=null;$("dlg").close();};
$("dlgSave").onclick=()=>{
  const nick=$("nickIn").value.replace(/[^\p{L}\p{N} .'’-]/gu,"").trim().slice(0,18),num=$("numIn").value.replace(/\D/g,"").slice(0,2);
  if(!nick){$("nickIn").focus();return;}
  if(!num){$("numIn").focus();toast("Bitte gib deine Rückennummer ein");return;}
  if(local.num&&String(+num)!==String(local.num)&&Object.keys(local.sent||{}).length&&!confirm("Achtung: Deine Rückennummer ist deine Erkennung in der Wertung. Mit einer neuen Nummer startest du eine neue Wertung. Trotzdem ändern?"))return;
  local.nick=nick;local.num=String(+num);lsave();$("dlg").close();updateTrikotBtn();toast("Trikot gespeichert");
  if(afterTrikot){const f=afterTrikot;afterTrikot=null;f();}
};
function updateTrikotBtn(){$("trikotBtn").textContent=local.nick?`${local.num?"#"+local.num+" ":""}${local.nick}`:"Dein Trikot";}

// ===================== Start =====================
renderPlay();updateTrikotBtn();renderBoards();
</script>
